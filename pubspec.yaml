name: ur_heart
description: "UR-Heart - Mindful Dating Sanctuary Flutter Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  dio: ^5.4.1
  flutter_image_compress: ^2.3.0
  blurhash_dart: ^1.1.1
  image: ^4.1.7
  http: ^1.2.2
  sentry_flutter: ^9.0.0
  web_socket_channel: ^3.0.3
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  url_launcher: ^6.2.5
  google_sign_in: ^7.2.0
  firebase_auth: ^6.7.0
  image_picker: ^1.2.3
  geolocator: ^13.0.2
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  camera: ^0.12.1
  sensors_plus: ^7.1.0
  app_links: ^7.2.1
  share_plus: ^12.0.2
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.1

dev_dependencies:

  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#021615"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
