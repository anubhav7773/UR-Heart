  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #090A10;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #splash-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease-out;
    }
    .pulsing-heart {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: radial-gradient(circle at center, #FF2E7E 0%, #7952F5 100%);
      box-shadow: 0 0 35px rgba(255, 46, 126, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: sanctuaryPulse 2s infinite ease-in-out;
    }
    .pulsing-heart svg {
      width: 36px;
      height: 36px;
      fill: #FFFFFF;
    }
    .sanctuary-title {
      margin-top: 20px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #FFFFFF 0%, #FF8CB3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sanctuary-sub {
      margin-top: 8px;
      font-size: 13px;
      color: #8C93A8;
      letter-spacing: 0.05em;
    }
    @keyframes sanctuaryPulse {
      0% { transform: scale(0.96); box-shadow: 0 0 25px rgba(255, 46, 126, 0.3); }
      50% { transform: scale(1.04); box-shadow: 0 0 45px rgba(121, 82, 245, 0.6); }
      100% { transform: scale(0.96); box-shadow: 0 0 25px rgba(255, 46, 126, 0.3); }
    }
  </style>
</head>
<body>
  <div id="splash-loading">

      </svg>
    </div>
    <div class="sanctuary-title">UR-Heart</div>
    <div class="sanctuary-sub">Entering Mindful Sanctuary...</div>
  </div>
