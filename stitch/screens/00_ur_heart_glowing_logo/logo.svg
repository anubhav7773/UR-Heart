<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="urh-flame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E63" />
      <stop offset="50%" stop-color="#FF5E7E" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>
    <linearGradient id="urh-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08D9D6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF2E63" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="#16161D"/>
  <rect x="2" y="2" width="116" height="116" rx="26" fill="none" stroke="url(#urh-glow)" stroke-width="1.5" opacity="0.4"/>
  <!-- Glowing Heart with Rising Desi Flame -->
  <path d="M60 92 C32 72 20 54 20 38 C20 26 29 18 41 18 C49 18 56 22 60 29 C64 22 71 18 79 18 C91 18 100 26 100 38 C100 54 88 72 60 92 Z" fill="url(#urh-flame)" filter="url(#glow-filter)"/>
  <!-- Inner Flame Motif -->
  <path d="M60 42 C64 50 68 56 68 62 C68 68 64 72 60 72 C56 72 52 68 52 62 C52 56 56 50 60 42 Z" fill="#FFFFFF" opacity="0.9"/>
</svg>