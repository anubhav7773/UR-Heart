  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #090A10;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
  </style>
</head>
<body>
  <script>
    // 1. Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('firebase-messaging-sw.js', { scope: '/' })
          .then(function(reg) {
            console.log('[Sanctuary SW] Background push worker registered:', reg.scope);
          })
          .catch(function(err) {
            console.log('[Sanctuary SW] Worker registration note:', err);
          });
      });
    }

    // 2. Web Screenshot Security Interceptors (Zero DOM Overlays to prevent tapjacking errors)
    window._urHeartPrivacyMode = false;
    window.setUrHeartPrivacyMode = function(enabled) {
      window._urHeartPrivacyMode = !!enabled;
    };

    // Intercept PrintScreen key, Ctrl+P, Ctrl+Shift+S
    window.addEventListener('keyup', function(e) {
      if (window._urHeartPrivacyMode) {
        if (e.key === 'PrintScreen' || e.keyCode === 44) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText('').catch(function() {});
          }
        }
      }
    });

    window.addEventListener('keydown', function(e) {
      if (window._urHeartPrivacyMode) {
        if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P' || e.key === 's' || e.key === 'S')) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }
    });

    // Disable context menu while in confidential dialogue
    window.addEventListener('contextmenu', function(e) {
      if (window._urHeartPrivacyMode) {
        e.preventDefault();
        return false;
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
