name: ruralheart_mobile
description: "Project RuralHeart - Cross-Platform Dating Application for Rural & Urban India"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  provider: ^6.1.1

  # Network & WebSockets
  dio: ^5.4.0
  web_socket_channel: ^2.4.1

  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Monetization & Payments
  google_mobile_ads: ^5.0.0
  razorpay_flutter: ^1.3.5

  # Location & UI Utilities
  geolocator: ^10.1.0
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  video_player: ^2.8.2

  # Firebase & Google Authentication
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_app_check: ^0.3.0
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^17.1.0

  # Window & System Security / URL Launcher
  flutter_windowmanager: ^0.2.0
  url_launcher: ^6.2.5

  # Audio Recording & Playback (Voice Bio)
  record: ^5.1.2
  audioplayers: ^6.0.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_linux: 1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
