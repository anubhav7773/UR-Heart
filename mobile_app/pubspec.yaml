name: ruralheart_mobile
description: "Project RuralHeart - Cross-Platform Dating Application for Rural & Urban India"
publish_to: 'none'
version: 1.0.3+2005

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  provider: ^6.1.1

  # Network & WebSockets
  dio: ^5.4.0
  web_socket_channel: ^2.4.1

  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Monetization & Payments
  google_mobile_ads: ^5.0.0
  in_app_purchase: ^3.2.0

  # Location & UI Utilities
  geolocator: ^10.1.0
  cached_network_image: ^3.3.1
  flutter_image_compress: ^2.3.0
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  video_player: ^2.8.2
  google_mlkit_text_recognition: ^0.13.0

  # Firebase & Google Authentication
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_app_check: ^0.3.0
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^17.1.0

  # Window & System Security / URL Launcher / App Update
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0
  http: ^1.2.0
  webview_flutter: ^4.10.0

  # Audio Recording & Playback (Voice Bio)
  record: ^5.1.2
  audioplayers: ^6.0.0
  path_provider: ^2.1.2
  intl: ^0.20.2
  sentry_flutter: ^8.14.2
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#12050B"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

dependency_overrides:
  record_linux: 1.3.1
  web: ^1.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
